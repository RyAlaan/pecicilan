<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pecicilan</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search"
    />
  </head>
  <body>
    <nav class="navbar">
      <p class="logo">PECICILAN</p>
    </nav>

    <header class="hero">
      <div class="overlay"></div>

      <div class="hero-content">
        <h1>An website for rate and review your favorite movies</h1>
        <p>Let's try it</p>
        <div class="searchBox">
          <div class="searchBar">
            <i data-lucide="search"></i>
            <input
              class="searchInput"
              type="text"
              name="searchInput"
              placeholder="Masukkan Nama Film"
            />
          </div>
          <div class="suggestionList"></div>
        </div>
      </div>
    </header>
    <section class="trending">
      <h2>Sedang Tren Sekarang</h2>

      <div class="trending-wrapper">
        <button class="slider-btn left" id="slideLeft">&#10094;</button>
        <div class="trending-slider" id="slider"></div>
        <button class="slider-btn right" id="slideRight">&#10095;</button>
      </div>
    </section>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <script type="module" src="./js/script.js"></script>
  </body>
</html>
