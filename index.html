<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pecicilan</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search"
    />
  </head>
  <body>
    <nav class="navbar">
      <p class="logo">PECICILAN</p>
    </nav>

    <header class="hero">
      <div class="overlay"></div>

      <div class="hero-content">
        <div class="hero-header">
          <h1>
            Search and explore detailed information about your favorite movies
          </h1>
          <p>Your movie journey starts here
          </p>
        </div>
        <div class="searchBox">
          <div class="searchBar">
            <i data-lucide="search"></i>
            <input
              class="searchInput"
              type="text"
              name="searchInput"
              placeholder="Masukkan Nama Film"
            />
          </div>
          <div class="suggestionList"></div>
        </div>
      </div>
    </header>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <script type="module" src="./js/script.js"></script>
  </body>
</html>
