<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Good Will Hunting</title>
    <link rel="stylesheet" href="./css/detail.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <a href="./index.html" class="nav-left">
          <i class="icon" data-lucide="house"></i>
          <p class="home-text">Home</p>
        </a>
        <div class="nav-search">
          <input
            name="inputSearch"
            type="text"
            placeholder="Find your next watch"
          />
        </div>
      </div>
    </nav>
    <div class="container">
      <section class="hero">
        <div class="hero-content">
          <div class="hero-header">
            <div class="hero-title">
              
            </div>
            <div class="tags">
              <a target="_blank" class="play">
                <i class="icon" data-lucide="circle-play"></i>
                <p>Play Trailer</p>
              </a>
              <div class="badge"><p>R-Rated</p></div>
              <div class="genre-list"></div>
            </div>
          </div>

          <div class="description">
            <h3>Description</h3>
            <p class="desc"></p>
          </div>

          <div class="movie-info">
            <div class="director">
              <img class="director-img" src="" alt="" />
              <div class="director-detail">
                <p class="director-name"></p>
                <p class="director-job"></p>
              </div>
            </div>
            <div class="rating">
              <div class="stars"></div>
              <div class="reviewer">
                <p>Reviewer</p>
                <span class="rating-value"></span>
              </div>
            </div>
          </div>
        </div>

        <img
          class="hero-img"
        />
      </section>

      <!-- RECOMMENDATION -->
      <section class="recommendation">
        <h2>You Might Also Like</h2>

        <div class="recommendation-list"></div>
      </section>
    </div>

      lucide.createIcons();
    </script>
  </body>
</html>
