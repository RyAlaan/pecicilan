<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Good Will Hunting</title>
    <link rel="stylesheet" href="./css/detail.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-content">
        <a class="nav-left" href="index.html">
          <i class="icon" data-lucide="house"></i>
          Home
        </a>

        <div class="nav-search">
          <i data-lucide="search"></i>
          <input
            name="searchInput"
            type="text"
            placeholder="Find your next watch"
          />
        </div>
      </div>

      <div class="suggestionList"></div>
    </nav>
    <div class="container">
      <section class="hero">
        <div class="hero-content">
          <div class="hero-header">
            <div class="hero-title"></div>
            <div class="tags">
              <a target="_blank" class="play">
                <i class="icon" data-lucide="circle-play"></i>
                <p>Play Trailer</p>
              </a>
              <div class="badge"></div>
              <div class="genre-list"></div>
            </div>
          </div>

          <div class="hero-metadata">
            <div class="hero-description">
              <h3>Description</h3>
              <p class="desc"></p>
            </div>
            <div class="movie-info">
              <div class="director">
                <img class="director-img" src="" alt="" />
                <div class="director-detail">
                  <p class="director-name"></p>
                  <p class="director-job"></p>
                </div>
              </div>
              <div class="rating">
                <div class="stars"></div>
                <div class="reviewer">
                  <p>Reviewer</p>
                  <span class="rating-value"></span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <img class="hero-img" />
      </section>

      <section class="recommendation">
        <h2>You Might Also Like</h2>

        <div class="recommendation-list"></div>
      </section>
      <footer class="footer">
        <div class="footer-content">
          <p class="footer-contact">Contact: bantalgulingteam@gmail.com</p>

          <p class="footer-links">DMCA | Contact Us | Fanspage</p>

          <p class="footer-desc">
            Pecicilan – a website for rate and review your favorite film .
          </p>

          <p class="footer-copy">Copyright © Pecicilan. All Rights Reserved.</p>
        </div>
      </footer>
    </div>

    <script type="module" src="./js/detail.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
